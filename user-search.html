<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git App - Felhasználó kereső</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Felhasználó keresése</h1>

        <input type="text" id="user-search-input" placeholder="Felhasználónév (pl. microsoft)">
        <button class="btn btn-primary" id="search-btn">Keresés</button>

        <div id="result"></div>
    </div>

    <script src="app.js"></script>
    <script>

        const GH_ACCESS_TOKEN = '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';

        async function searchUsers(searchText) {
            try {
                const res = await fetch('https://api.github.com/search/users?q=' 
                    + encodeURIComponent(searchText), {
                        headers: {
                            'Authorization': 'Bearer ' + GH_ACCESS_TOKEN
                        }
                    });
                
                if (!res.ok) {
                    throw Error('Hibás válasz, státuszkód: ' + res.status);
                }

                const data = await res.json();
                const resultDiv = document.querySelector('#result');
                resultDiv.innerHTML = '';

                for (const user of data.items) {
                    const userHtml = `
                        <div class="card">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <img src="${user.avatar_url}" alt="Avatar" style="width: 50px; border-radius: 50%;">
                                <div>
                                    <a href="user.html?id=${encodeURIComponent(user.login)}">
                                        <strong>${user.login}</strong>
                                    </a>
                                    <p>Típus: ${user.type}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    resultDiv.innerHTML += userHtml;
                }
            } catch (err) {
                console.error(err);
                alert('Hiba történt a keresés során.');
            }
        }

        const searchBtn = document.querySelector('#search-btn');
        searchBtn.addEventListener('click', () => {
            const inputElem = document.querySelector('#user-search-input');
            searchUsers(inputElem.value);
        });
    </script>
</body>
</html>
