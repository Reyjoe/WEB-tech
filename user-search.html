<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git App - Felhasználó kereső</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Felhasználók keresése</h1>

        <input type="text" id="user-search-input" placeholder="GitHub felhasználónév...">
        <button class="btn btn-primary" id="user-search-btn">Keresés</button>

        <div id="user-result" class="row"></div>
    </div>

    <script src="app.js"></script>
    <script>
        async function loadUsers(searchText) {
            // Üres keresőkifejezés esetén hibaüzenet alert()-tel
            if (!searchText.trim()) {
                alert('Hiba: A keresőmező nem maradhat üresen!');
                return;
            }

            try {
                // Felhasználók lekérdezése a GitHub API-n keresztül
                const res = await fetch('https://api.github.com/search/users?q=' 
                    + encodeURIComponent(searchText), {
                        headers: {
                            'Authorization': 'Bearer ' + GH_ACCESS_TOKEN
                        }
                    });

                if (!res.ok) {
                    throw Error('Hiba a lekérdezés során, státuszkód: ' + res.status);
                }

                const data = await res.json();
                const resultDiv = document.querySelector('#user-result');
                resultDiv.innerHTML = '';

                // Találati listában név és profilkép megjelenítése
                data.items.forEach(user => {
                    const userHtml = `
                        <div class="col col-4">
                            <div class="card" style="text-align: center;">
                                <img src="${user.avatar_url}" alt="${user.login}" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px;">
                                <p><strong>${user.login}</strong></p>
                                <a href="${user.html_url}" target="_blank" class="btn btn-secondary">Profil</a>
                            </div>
                        </div>
                    `;
                    resultDiv.innerHTML += userHtml;
                });

            } catch (err) {
                console.error(err);
                alert('Sajnáljuk, hiba történt a felhasználók keresése közben.');
            }
        }

        const searchBtn = document.querySelector('#user-search-btn');
        searchBtn.addEventListener('click', () => {
            const inputElem = document.querySelector('#user-search-input');
            loadUsers(inputElem.value);
        });
    </script>
</body>
</html>
