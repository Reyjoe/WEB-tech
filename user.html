<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git App - Felhasználó adatlap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="user-profile" class="card" style="margin-top: 20px;">
            <p>Felhasználó betöltése...</p>
        </div>
        <br>
        <a href="user-search.html" class="btn btn-secondary">Vissza a kereséshez</a>
    </div>

    <script>
        
        const GH_ACCESS_TOKEN = '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';

        async function loadUser(userId) {
            const profileDiv = document.querySelector('#user-profile');
            try {
                const res = await fetch(`https://api.github.com/users/${userId}`, {
                    headers: { 'Authorization': 'Bearer ' + GH_ACCESS_TOKEN }
                });

                if (!res.ok) throw Error('Hiba: ' + res.status);

                const user = await res.json();
                
                let html = `<div style="text-align:center"><img src="${user.avatar_url}" style="width:120px;border-radius:50%"></div>`;
                html += `<h2 style="text-align:center">${user.login}</h2>`;
                
                const fields = [
                    { label: 'Név', value: user.name },
                    { label: 'Blog', value: user.blog, isLink: true },
                    { label: 'Helyszín', value: user.location },
                    { label: 'Bio', value: user.bio },
                    { label: 'Repók száma', value: user.public_repos },
                    { label: 'Követők', value: user.followers }
                ];

                fields.forEach(f => {
                    if (f.value !== null && f.value !== "") {
                        html += `<p><strong>${f.label}:</strong> ` + 
                                (f.isLink ? `<a href="${f.value}" target="_blank">${f.value}</a>` : f.value) + `</p>`;
                    }
                });

                profileDiv.innerHTML = html;
            } catch (err) {
                profileDiv.innerHTML = `<p style="color:red">Hiba: Nem sikerült betölteni a felhasználót. (Ellenőrizd a tokent vagy az ID-t!)</p>`;
            }
        }

        // Paraméter kinyerése a címsorból
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        if (userId) {
            loadUser(userId);
        } else {
            document.querySelector('#user-profile').innerHTML = `<p>Nincs kiválasztva felhasználó. Kérlek használj a <a href="user-search.html">keresőt</a>!</p>`;
        }
    </script>
</body>
</html>
